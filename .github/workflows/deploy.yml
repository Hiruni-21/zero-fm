# Deploys Zero FM to Cloudflare Workers.
#
#   push to dev  -> preview version (its own URL, the live site is untouched)
#   push to main -> production (the live site)
#
# Needs two GitHub repository secrets:
#   CLOUDFLARE_API_TOKEN   (Cloudflare token from the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (shown on the Cloudflare Workers & Pages overview page)

name: Deploy to Cloudflare

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Only one deploy per branch at a time; a newer push replaces an older one
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      # vinext builds the site and deploys it with Cloudflare's tools.
      # --no-promote uploads a new version and prints its preview URL
      # without switching the live site over to it. (--preview would
      # deploy to the same "zero-fm" worker and replace the live site.)
      - name: Deploy preview (dev branch)
        if: github.ref_name == 'dev'
        run: npm run deploy:vinext -- --no-promote

      - name: Deploy live site (main branch)
        if: github.ref_name == 'main'
        run: npm run deploy:vinext
